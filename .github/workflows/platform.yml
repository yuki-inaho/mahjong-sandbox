name: 手動のLinux全体・配布消費検査

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  PYTHONUTF8: '1'

jobs:
  fixed-full-linux:
    name: Linux / 固定版・形式検証・SDK・配布
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/dist/tools/browser-engines
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: 公式配布から作業用の固定版を導入
        run: python scripts/bootstrap.py --profile full
      - name: SDKと形式検証を含めて検査
        run: python scripts/verify_platform.py --profile full
      - name: 固定したブラウザ検査用依存とChromiumを準備
        run: |
          source dist/tools/activate.sh
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/browser
          node tools/browser/node_modules/playwright/cli.js install chromium-headless-shell --with-deps
      - name: 実ChromiumでSDKと画面を検査
        run: |
          source dist/tools/activate.sh
          python scripts/check_browser.py
      - name: 書庫を作り別環境から消費
        run: python scripts/package.py
      - name: 検査集計と配布目録のJSONだけを1日保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/bootstrap/*/summary.json
            dist/verification/*/summary.json
            dist/wasm-build/*/summary.json
            dist/packages/*/summary.json
            dist/packages/*/manifest.json
            dist/packages/*/distribution-path-checks.json
            dist/browser-check/*/summary.json
            dist/browser-check/*/assertions.json
          retention-days: 1
          if-no-files-found: error
