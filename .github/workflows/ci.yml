name: Linux PRの基本検査

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  PYTHONUTF8: '1'
  RUSTUP_TOOLCHAIN: '1.100.0'

jobs:
  linux:
    name: Linux / Rust・API・SDK単体
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pythonを準備
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Nodeを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: 固定したRustを準備
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: 整形を確認
        run: cargo fmt --all --check
      - name: 静的解析
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust・API・CLIの単体と結合検査
        run: cargo test --locked --workspace
      - name: 宣言・Schema・TypeScript生成物の同期を確認
        run: |
          python scripts/generate_rules.py --check
          cargo run --locked -p suzume-api --bin export-schema -- --check
          python scripts/generate_protocol_ts.py --check
      - name: Python検査器の単体検査
        run: python -m unittest discover -s scripts/tests
      - name: 文書checkerの自己試験とリンク・コマンド検査
        run: |
          python scripts/check_documentation.py --self-test
          python scripts/check_documentation.py --json
      - name: SDKの依存を準備
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/suzume
      - name: WASMを生成せずSDKの型と単体を検査
        run: npm --prefix packages/suzume run test:unit
