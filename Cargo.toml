[package]
name = "suzume"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "契約と形式検証を備えた、独自実装の四人リーチ麻雀"
license = "MIT"
repository = "https://github.com/yuki-inaho/mahjong-sandbox"
include = ["src/**", "rules/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
path = "src/lib.rs"

[dependencies]

[profile.release]
lto = true
codegen-units = 1
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = "warn"

[workspace]
members = ["crates/suzume-api", "crates/suzume-cli", "crates/suzume-wasm"]
default-members = ["crates/suzume-cli"]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=0.8.22"
toml = "=0.8.23"
sha2 = "=0.10.9"
