[package]
name = "suzume-wasm"
version = "0.2.0"
edition = "2021"
rust-version = "1.100"
description = "すずめの版付きJSON APIをJavaScriptへ公開する薄いWebAssembly結合"
license = "MIT"
repository = "https://github.com/yuki-inaho/mahjong-sandbox"
include = ["src/**", "Cargo.toml", "LICENSE"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
suzume-api = { path = "../suzume-api", version = "0.2.0" }
wasm-bindgen = "=0.2.130"
